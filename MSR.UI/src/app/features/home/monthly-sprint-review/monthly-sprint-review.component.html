<div class="landing">
  <div class="landing-inner">
    <header class="landing-header">
      <h1>MONTHLY SPRINT REVIEW</h1>
      <span class="accent-bar"></span>
    </header>

    <div class="cards">
      <a
        class="report-card"
        *ngFor="let r of reports"
        [routerLink]="r.route"
        [attr.data-theme]="r.theme">
        <div class="icon">
          <ng-container [ngSwitch]="r.icon">
            <svg *ngSwitchCase="'analytics'" width="30" height="30" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"></path>
              <rect x="7" y="12" width="3" height="6"></rect>
              <rect x="12" y="8" width="3" height="10"></rect>
              <rect x="17" y="4" width="3" height="14"></rect>
            </svg>
            <svg *ngSwitchCase="'shield'" width="30" height="30" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6l8-4z"></path>
              <path d="M9 12l2 2 4-4"></path>
            </svg>
            <svg *ngSwitchCase="'calendar'" width="30" height="30" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="17" rx="2"></rect>
              <path d="M3 9h18M8 2v4M16 2v4"></path>
            </svg>
          </ng-container>
        </div>

        <h2 class="title">{{ r.title }}</h2>
        <p class="desc">{{ r.description }}</p>

        <div class="divider"></div>
        <span class="open-report">
          Open Report
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </span>
      </a>
    </div>
  </div>
</div>
