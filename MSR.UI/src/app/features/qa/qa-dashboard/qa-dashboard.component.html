<div class="page dashboard">
  <a class="back-link" routerLink="/">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M11 18l-6-6 6-6"></path>
    </svg>
    Monthly Sprint Review
  </a>

  <header class="report-header">
    <h1>QA MSR Report</h1>
    <p>Monthly Sprint Review - QA Performance</p>
  </header>

  <div class="card product-bar">
    <app-product-selector
      [products]="products"
      [selectedId]="selectedProductId"
      (selectedIdChange)="onProductChange($event)">
    </app-product-selector>
  </div>

  <!-- KPI Summary -->
  <app-dashboard-section title="KPI Summary" [index]="1">
    <div filter class="kpi-filter">
      <span class="inline-label">KPI Filter</span>
      <app-sprint-multi-select
        [selected]="selectedKpiSprints"
        (selectedChange)="onKpiSprintsChange($event)">
      </app-sprint-multi-select>
    </div>

    <app-loading-state *ngIf="kpiState === 'loading'" message="Loading KPIs…"></app-loading-state>
    <app-error-state *ngIf="kpiState === 'error'" (retry)="loadKpis()"></app-error-state>
    <app-empty-state
      *ngIf="kpiState === 'empty'"
      message="No sprints selected. Choose one or more sprints to view KPIs.">
    </app-empty-state>

    <div class="kpi-grid" *ngIf="kpiState === 'ready' && kpi">
      <app-kpi-card label="Total Stories" [value]="kpi.totalStories" unit="Total" theme="blue">
        <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      </app-kpi-card>
      <app-kpi-card label="QA Capacity" [value]="kpi.capacity" unit="Story Points" theme="green">
        <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      </app-kpi-card>
      <app-kpi-card label="Total Story Points" [value]="kpi.totalStoryPoints" unit="Points" theme="orange">
        <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
      </app-kpi-card>
      <app-kpi-card label="Rollovers" [value]="kpi.rollovers" unit="Total" theme="purple">
        <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </app-kpi-card>
      <app-kpi-card label="Rollover Points" [value]="kpi.rolloverPoints" unit="Points" theme="teal">
        <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      </app-kpi-card>
      <app-kpi-card label="Observations" [value]="kpi.observations" unit="Total" theme="red">
        <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path></svg>
      </app-kpi-card>
    </div>
  </app-dashboard-section>

  <!-- Performance Report -->
  <app-dashboard-section title="Performance Report" [index]="2">
    <div filter class="range-filter">
      <span class="inline-label">Sprint Range</span>
      <app-sprint-range-selector
        [ranges]="ranges"
        [selectedIndex]="selectedRangeIndex"
        (rangeChange)="onRangeChange($event)">
      </app-sprint-range-selector>
    </div>

    <div class="chart-grid qa-charts">
      <app-chart-card class="span-5" [index]="1" title="QA Rollover Trend" subtitle="Rollover Points"
        [state]="rollover.state" [options]="rollover.options" (retry)="loadCharts()"></app-chart-card>
      <app-chart-card class="span-7" [index]="2" title="Story Points Tested" subtitle="QA-wise · Sum of Story Points Tested"
        [state]="storyPoints.state" [options]="storyPoints.options" [chartHeight]="storyPointsChartHeight"
        [scrollMinHeight]="storyPointsMinHeight" (retry)="loadCharts()"></app-chart-card>
      <app-chart-card class="span-12" [index]="3" title="Daily Delivery Trend" subtitle="Delivered Points"
        [state]="delivery.state" [options]="delivery.options" [chartHeight]="320"
        (retry)="loadCharts()"></app-chart-card>
    </div>
  </app-dashboard-section>
</div>
